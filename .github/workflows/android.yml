name: Android quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android platform
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Run rule-engine smoke tests
        run: |
          mkdir -p build/smoke
          javac -encoding UTF-8 -d build/smoke app/src/main/java/com/proyectx/focus/Rule.java app/src/main/java/com/proyectx/focus/RuleEngine.java tools/RuleEngineSmokeTest.java
          java -cp build/smoke com.proyectx.focus.RuleEngineSmokeTest

      - name: Build debug and release artifacts
        run: ./gradlew :app:assembleDebug :app:assembleRelease
