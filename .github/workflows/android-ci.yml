name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Reject obvious credentials and private keys
        run: |
          ! git grep -nEI '(-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}|AKIA[0-9A-Z]{16})' -- . ':!gradle/wrapper/gradle-wrapper.jar'
      - name: Verify formatting
        run: ./gradlew --no-daemon --no-configuration-cache spotlessCheck
      - name: Run JVM rule-engine checks
        run: |
          mkdir -p build/smoke
          sources=(
            app/src/main/java/com/proyectx/focus/ScheduleWindow.java
            app/src/main/java/com/proyectx/focus/Rule.java
            app/src/main/java/com/proyectx/focus/RuleEngine.java
            app/src/main/java/com/proyectx/focus/DomainPolicy.java
            app/src/main/java/com/proyectx/focus/DailyBudget.java
            app/src/main/java/com/proyectx/focus/DailyBudgetEngine.java
            app/src/main/java/com/proyectx/focus/DnsQuestion.java
            app/src/main/java/com/proyectx/focus/DnsQuestionParser.java
            app/src/main/java/com/proyectx/focus/DnsResponseBuilder.java
            app/src/main/java/com/proyectx/focus/LocalDnsPolicy.java
            app/src/main/java/com/proyectx/focus/DnsResolutionExecutor.java
            app/src/main/java/com/proyectx/focus/DnsVpnPacket.java
            app/src/main/java/com/proyectx/focus/DnsVpnPacketCodec.java
            app/src/main/java/com/proyectx/focus/PolicyBundleVerifier.java
            app/src/main/java/com/proyectx/focus/PolicyBundleMetadata.java
            app/src/main/java/com/proyectx/focus/PolicyBundleState.java
            app/src/main/java/com/proyectx/focus/FocusSession.java
            app/src/main/java/com/proyectx/focus/InstalledApp.java
            app/src/main/java/com/proyectx/focus/LocalDayWindow.java
            tools/RuleEngineSmokeTest.java
            tools/FocusSessionSmokeTest.java
            tools/ScheduleWindowSmokeTest.java
            tools/InstalledAppSmokeTest.java
            tools/DomainPolicySmokeTest.java
            tools/DomainPolicyRegressionSmokeTest.java
            tools/DailyBudgetSmokeTest.java
            tools/DnsQuestionParserSmokeTest.java
            tools/DnsResponseBuilderSmokeTest.java
            tools/LocalDnsPolicySmokeTest.java
            tools/DnsResolutionExecutorSmokeTest.java
            tools/DnsVpnPacketCodecSmokeTest.java
            tools/DnsVpnPrivacyBoundarySmokeTest.java
            tools/DnsCoverageLabSmokeTest.java
            tools/DnsParserRobustnessSmokeTest.java
            tools/AccessibilityPrivacyBoundarySmokeTest.java
            tools/PolicyBundleVerifierSmokeTest.java
            tools/PolicyBundleStateSmokeTest.java
            tools/LocalDayWindowSmokeTest.java
            tools/ReleaseGovernanceSmokeTest.java
          )
          javac -encoding UTF-8 -d build/smoke "${sources[@]}"
          tests=(
            RuleEngineSmokeTest FocusSessionSmokeTest ScheduleWindowSmokeTest InstalledAppSmokeTest
            DomainPolicySmokeTest DomainPolicyRegressionSmokeTest DailyBudgetSmokeTest DnsQuestionParserSmokeTest
            DnsResponseBuilderSmokeTest LocalDnsPolicySmokeTest DnsResolutionExecutorSmokeTest DnsCoverageLabSmokeTest DnsParserRobustnessSmokeTest AccessibilityPrivacyBoundarySmokeTest PolicyBundleVerifierSmokeTest PolicyBundleStateSmokeTest LocalDayWindowSmokeTest
            DnsVpnPacketCodecSmokeTest
            DnsVpnPrivacyBoundarySmokeTest
            ReleaseGovernanceSmokeTest
          )
          for test in "${tests[@]}"; do java -cp build/smoke "com.proyectx.focus.${test}"; done
      - name: Install Android SDK platform 37.0
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build and lint Android artifacts
        run: ./gradlew --no-daemon --no-configuration-cache :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Generate CycloneDX SBOM
        run: ./gradlew --no-daemon --no-configuration-cache cyclonedxBom

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes against GitHub advisories
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
